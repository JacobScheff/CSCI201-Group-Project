spring.application.name=rally
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/rally}
spring.datasource.username=${DATABASE_USER:rally}
spring.datasource.password=${DATABASE_PASSWORD:rally-local-password}
spring.datasource.hikari.maximum-pool-size=10
spring.sql.init.mode=always
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.port=${PORT:8080}
server.error.include-message=never
server.tomcat.threads.max=100
app.jwt-secret=${JWT_SECRET:rally-local-development-secret-change-before-deploying}
app.origins=${APP_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}
app.images=${APP_IMAGES:./data/images}
app.images-in-database=${APP_IMAGES_IN_DATABASE:false}
