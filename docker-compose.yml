services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rally}
      POSTGRES_USER: ${POSTGRES_USER:-rally}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rally-local-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-rally}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-rally}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-rally-local-password}
      APP_JWT_SECRET: ${JWT_SECRET:-rally-local-development-secret-change-before-deploying}
      APP_ORIGINS: ${APP_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      APP_IMAGES: /app/images
    volumes:
      - images:/app/images
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
  frontend:
    build: ./frontend
    ports:
      - "${APP_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  pgdata:
  images:
